name: regen-types

# Regenerates src/generated/types.ts from the published OpenAPI spec and opens
# a PR when it changes.
#
# The spec repo dispatches on merge, so that is the normal path. The cron is a
# backstop: GitHub disables a scheduled workflow after 60 days without repo
# activity, so it cannot be the only trigger.

on:
  repository_dispatch:
    types: [spec-changed]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run regen
      - run: npm run typecheck
      # Opened as the app, not with GITHUB_TOKEN: GitHub does not start a
      # workflow from an event the repository's own token created, so a
      # GITHUB_TOKEN PR would arrive with no checks on it.
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPEC_BOT_APP_ID }}
          private-key: ${{ secrets.SPEC_BOT_PRIVATE_KEY }}
      - name: Open PR if the spec changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.token }}
          commit-message: "chore: regenerate types from updated OpenAPI spec"
          branch: chore/regen-types
          delete-branch: true
          title: "chore: regenerate types from updated OpenAPI spec"
          body: |
            The upstream OpenAPI spec changed. This PR regenerates
            `src/generated/types.ts` and updates the spec hash in `.spec.yml`.

            Review the type diff, bump the version and CHANGELOG if the
            public surface changed, then merge.
